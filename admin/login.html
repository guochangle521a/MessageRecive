<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 留言管理系统</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 50%, #1a237e 100%);
            position: relative;
            overflow: hidden;
        }
        .login-wrapper::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            top: -200px;
            right: -150px;
        }
        .login-wrapper::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            bottom: -100px;
            left: -80px;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 24px 80px rgba(0,0,0,0.25);
            position: relative;
            z-index: 1;
        }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo .icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: #fff;
        }
        .login-logo h1 { font-size: 22px; color: #1a1a2e; font-weight: 700; }
        .login-logo p { color: #8892a4; font-size: 13px; margin-top: 6px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.25s;
            outline: none;
            box-sizing: border-box;
        }
        .form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.12); }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(26,115,232,0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show { display: block; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <div class="icon">&#x1F4CB;</div>
                <h1>留言管理系统</h1>
                <p>三奇官网 - 留言数据管理后台</p>
            </div>
            <div class="error-msg" id="errorMsg"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入管理员账号" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">登 录</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var btn = document.getElementById('loginBtn');
            var errMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.textContent = '登录中...';
            errMsg.classList.remove('show');

            try {
                var res = await fetch('../api/admin/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                var data = await res.json();
                if (data.code === 0) {
                    // 存储 token 和用户信息
                    if (data.data.token) {
                        localStorage.setItem('api_token', data.data.token);
                    }
                    localStorage.setItem('user_info', JSON.stringify(data.data));
                    window.location.href = 'index.html';
                } else {
                    errMsg.textContent = data.msg;
                    errMsg.classList.add('show');
                }
            } catch (err) {
                errMsg.textContent = '网络错误，请检查后端服务是否启动';
                errMsg.classList.add('show');
            }

            btn.disabled = false;
            btn.textContent = '登 录';
        });
    </script>
</body>
</html>
