<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 留言管理系统</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">&#x1F4CB;</div>
                <div>
                    <h2>留言管理系统</h2>
                    <span id="sidebarUserRole"></span>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer"><span>&copy; 2026 三奇官网</span></div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
                    <h3>用户管理</h3>
                </div>
                <div class="topbar-right">
                    <span class="user-info">
                        <span class="user-avatar" id="userAvatar">A</span>
                        <span id="topUsername">admin</span>
                    </span>
                    <button class="btn-logout" onclick="doLogout()">退出</button>
                </div>
            </header>

            <div class="page-content">

                <!-- New User -->
                <div class="panel">
                    <div class="panel-header">
                        <h4>&#x2795; 新增用户</h4>
                    </div>
                    <div class="panel-body">
                        <div class="inline-form" style="gap:16px;">
                            <div class="form-field">
                                <label>用户名 <span style="color:#d93025;">*</span></label>
                                <input type="text" id="newUsername" placeholder="登录用户名">
                            </div>
                            <div class="form-field">
                                <label>真实姓名</label>
                                <input type="text" id="newRealName" placeholder="真实姓名">
                            </div>
                            <div class="form-field">
                                <label>密码 <span style="color:#d93025;">*</span></label>
                                <input type="password" id="newPassword" placeholder="密码">
                            </div>
                            <div class="form-field">
                                <label>角色</label>
                                <select id="newRole" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;">
                                    <option value="user">普通用户</option>
                                    <option value="admin">管理员</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" onclick="addUser()">&#x2795; 创建用户</button>
                        </div>
                        <div style="margin-top:16px;padding:14px;border:1px solid #dce6f5;border-radius:10px;background:#f8fbff;">
                            <label style="font-size:13px;color:#1a73e8;font-weight:600;display:block;margin-bottom:8px;">海外独立站权限</label>
                            <div id="newUserSources" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
                        </div>
                        <div style="margin-top:10px;padding:14px;border:1px solid #f3d7b4;border-radius:10px;background:#fffaf3;">
                            <label style="font-size:13px;color:#e8710a;font-weight:600;display:block;margin-bottom:8px;">国内官网权限</label>
                            <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="newCanViewChina"> 允许查看、处理和导出国内官网留言</label>
                        </div>
                    </div>
                </div>

                <!-- User List -->
                <div class="panel">
                    <div class="panel-header">
                        <h4>&#x1F465; 用户列表</h4>
                        <span style="font-size:12px;color:#8892a4;">共 <span id="userCount">0</span> 人</span>
                    </div>
                    <div class="panel-body no-padding">
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>用户名</th>
                                        <th>真实姓名</th>
                                        <th>角色</th>
                                        <th>海外来源权限</th>
                                        <th>国内官网权限</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="userTbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== Edit User Modal ===== -->
    <div class="modal-overlay" id="editUserModal" style="display:none;">
        <div class="modal" style="width:520px;">
            <div class="modal-header">
                <h3>&#x270F; 编辑用户</h3>
                <button class="modal-close" onclick="closeEditUser()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">用户名</div>
                        <div class="detail-value" id="euUsername">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">真实姓名</div>
                        <input type="text" id="euRealName" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">新密码（留空不修改）</div>
                        <input type="password" id="euPassword" placeholder="留空则不修改密码" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">角色</div>
                        <select id="euRole" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
                            <option value="user">普通用户</option>
                            <option value="admin">管理员</option>
                        </select>
                    </div>
                    <div class="detail-item full">
                        <div class="detail-label">海外独立站来源权限</div>
                        <div id="euSources" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;"></div>
                    </div>
                    <div class="detail-item full" style="padding:10px;background:#fffaf3;border-radius:8px;"><div class="detail-label">国内官网权限</div><label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="euCanViewChina"> 允许查看、处理和导出国内官网留言</label></div>
                    <div class="detail-item">
                        <div class="detail-label">状态</div>
                        <select id="euActive" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveEditUser()">&#x1F4BE; 保存</button>
                <button class="btn btn-outline" onclick="closeEditUser()">关闭</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="assets/app.js?v=20260818-key-permission-split"></script>
</body>
</html>
