<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>国内官网留言 - 留言管理系统</title><link rel="stylesheet" href="assets/style.css"></head>
<body><div class="layout"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="logo">&#x1F4CB;</div><div><h2>留言管理系统</h2><span id="sidebarUserRole"></span></div></div><nav class="sidebar-nav" id="sidebarNav"></nav><div class="sidebar-footer"><span>&copy; 2026 三奇官网</span></div></aside>
<main class="main-content"><header class="topbar"><div class="topbar-left"><button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button><h3>国内官网留言</h3></div><div class="topbar-right"><span class="user-info"><span class="user-avatar" id="userAvatar">A</span><span id="topUsername">admin</span></span><button class="btn-logout" onclick="doLogout()">退出</button></div></header>
<div class="page-content"><div class="panel"><div class="panel-header"><h4>&#x1F50D; 筛选</h4><button class="btn btn-outline btn-sm" onclick="resetFilter()">重置</button></div><div class="panel-body"><div class="filter-bar"><input type="text" id="fKeyword" placeholder="姓名/电话/公司/地区/需求..."><select id="fStatus"><option value="">全部状态</option></select><input type="date" id="fStartDate"><span>至</span><input type="date" id="fEndDate"><button class="btn btn-primary" onclick="applyFilters()">筛选</button><button class="btn btn-success" onclick="exportCSV()">&#x1F4E5; 导出</button></div></div></div>
<div class="stats-grid"><div class="stat-card"><div class="stat-info"><div class="stat-value" id="chinaTotal">0</div><div class="stat-label">国内留言总数</div></div></div><div class="stat-card"><div class="stat-info"><div class="stat-value" id="chinaNew">0</div><div class="stat-label">新留言</div></div></div><div class="stat-card"><div class="stat-info"><div class="stat-value" id="chinaContacted">0</div><div class="stat-label">已联系</div></div></div><div class="stat-card"><div class="stat-info"><div class="stat-value" id="chinaDeal">0</div><div class="stat-label">已成交</div></div></div></div>
<div class="panel"><div class="panel-header"><h4>国内官网留言记录 <span id="resultCount" style="font-weight:400;color:#8892a4;font-size:12px;"></span></h4><button class="btn btn-outline btn-sm" onclick="batchUpdate(2)">批量标记成交</button></div><div class="panel-body no-padding"><div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th><th>ID</th><th>姓名</th><th>联系电话</th><th>业务类型</th><th>来源</th><th>状态</th><th>处理人</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="msgTbody"></tbody></table></div></div><div class="panel-footer"><div class="pagination"><div id="pageInfo"></div><div class="pagination-btns" id="pageBtns"></div></div></div></div></div></main></div>
<div class="modal-overlay" id="detailModal" style="display:none;"><div class="modal" style="width:680px;"><div class="modal-header"><h3>国内官网留言 #<span id="dId">-</span></h3><button class="modal-close" onclick="closeDetail()">&times;</button></div><div class="modal-body"><div class="detail-grid">
<div class="detail-item"><div class="detail-label">姓名</div><div class="detail-value" id="dName">-</div></div><div class="detail-item"><div class="detail-label">联系电话</div><div class="detail-value" id="dPhone">-</div></div><div class="detail-item"><div class="detail-label">电子邮箱</div><div class="detail-value" id="dEmail">-</div></div><div class="detail-item"><div class="detail-label">业务类型</div><div class="detail-value" id="dType">-</div></div><div class="detail-item"><div class="detail-label">公司或机构</div><div class="detail-value" id="dCompany">-</div></div><div class="detail-item"><div class="detail-label">所在地区</div><div class="detail-value" id="dCountry">-</div></div><div class="detail-item"><div class="detail-label">来源</div><div class="detail-value" id="dSource">-</div></div><div class="detail-item full"><div class="detail-label">提交页面</div><div class="detail-value" id="dSourceUrl">-</div></div><div class="detail-item full"><div class="detail-label">联系偏好</div><div class="detail-value" id="dExtra">-</div></div><div class="detail-item full"><div class="detail-label">需求说明</div><div class="detail-value" id="dRemark">-</div></div>
<div class="detail-item"><div class="detail-label">状态</div><select id="dStatus" style="width:100%;padding:8px;"></select></div><div class="detail-item"><div class="detail-label">处理人</div><input id="dHandler" style="width:100%;padding:8px;"></div><div class="detail-item full"><div class="detail-label">处理记录</div><textarea id="dHandleRecord" style="width:100%;min-height:80px;padding:8px;"></textarea></div><div class="detail-item"><div class="detail-label">IP</div><div class="detail-value" id="dIP">-</div></div><div class="detail-item"><div class="detail-label">提交时间</div><div class="detail-value" id="dTime">-</div></div></div></div><div class="modal-footer"><button class="btn btn-primary" onclick="saveDetail()">保存</button><button class="btn btn-outline" onclick="closeDetail()">关闭</button></div></div></div>
<div class="toast-container" id="toastContainer"></div><script src="assets/app.js?v=20260818-china-separate"></script></body></html>
