<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言管理 - 留言管理系统</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="layout">

        <!-- ===== Sidebar ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">&#x1F4CB;</div>
                <div>
                    <h2>留言管理系统</h2>
                    <span id="sidebarUserRole"></span>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
            </nav>
            <div class="sidebar-footer">
                <span>&copy; 2026 三奇官网</span>
            </div>
        </aside>

        <!-- ===== Main Content ===== -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
                    <h3>留言列表</h3>
                </div>
                <div class="topbar-right">
                    <span class="user-info">
                        <span class="user-avatar" id="userAvatar">A</span>
                        <span id="topUsername">admin</span>
                    </span>
                    <button class="btn-logout" onclick="doLogout()">退出</button>
                </div>
            </header>

            <div class="page-content">

                <!-- Filter -->
                <div class="panel">
                    <div class="panel-header">
                        <h4>&#x1F50D; 筛选</h4>
                        <button class="btn btn-outline btn-sm" onclick="resetFilter()">重置</button>
                    </div>
                    <div class="panel-body">
                        <div class="filter-bar">
                            <input type="text" id="fKeyword" placeholder="姓名/手机号/内容...">
                            <select id="fSource"><option value="">全部来源</option></select>
                            <select id="fStatus"><option value="">全部状态</option></select>
                            <input type="date" id="fStartDate" title="开始日期">
                            <span style="color:#8892a4;">至</span>
                            <input type="date" id="fEndDate" title="结束日期">
                            <button class="btn btn-primary" onclick="applyFilters()">筛选</button>
                            <button class="btn btn-success" onclick="exportCSV()">&#x1F4E5; 导出</button>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="panel">
                    <div class="panel-header">
                        <h4>&#x1F4CB; 留言记录 <span style="font-weight:400;color:#8892a4;font-size:12px;" id="resultCount"></span></h4>
                        <button class="btn btn-outline btn-sm" onclick="batchUpdate(2)">批量标记成交</button>
                    </div>
                    <div class="panel-body no-padding">
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width:40px;"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
                                        <th>ID</th>
                                        <th>客户姓名</th>
                                        <th>手机号</th>
                                        <th>来源</th>
                                        <th>状态</th>
                                        <th>处理人</th>
                                        <th>提交时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="msgTbody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="panel-footer">
                        <div class="pagination">
                            <div class="pagination-info" id="pageInfo"></div>
                            <div class="pagination-btns" id="pageBtns"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== Detail Modal ===== -->
    <div class="modal-overlay" id="detailModal" style="display:none;">
        <div class="modal" style="width:640px;">
            <div class="modal-header">
                <h3>&#x1F4AC; 留言详情 #<span id="dId">-</span></h3>
                <button class="modal-close" onclick="closeDetail()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-grid">
                    <div class="detail-item"><div class="detail-label">客户姓名</div><div class="detail-value" id="dName">-</div></div>
                    <div class="detail-item"><div class="detail-label">手机号</div><div class="detail-value" id="dPhone">-</div></div>
                    <div class="detail-item"><div class="detail-label">邮箱</div><div class="detail-value" id="dEmail">-</div></div>
                    <div class="detail-item"><div class="detail-label">来源</div><div class="detail-value" id="dSource">-</div></div>
                    <div class="detail-item full">
                        <div class="detail-label">留言内容</div>
                        <div class="detail-value" id="dRemark" style="background:#f8fafc;padding:12px;border-radius:8px;">-</div>
                    </div>
                    <!-- 状态 -->
                    <div class="detail-item">
                        <div class="detail-label">状态</div>
                        <select id="dStatus" class="status-select" style="width:100%;padding:8px;"></select>
                    </div>
                    <!-- 处理人 -->
                    <div class="detail-item">
                        <div class="detail-label">处理人</div>
                        <input type="text" id="dHandler" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;" placeholder="输入处理人姓名">
                    </div>
                    <!-- 处理记录 -->
                    <div class="detail-item full">
                        <div class="detail-label">处理记录</div>
                        <textarea id="dHandleRecord" style="width:100%;min-height:80px;padding:10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;resize:vertical;" placeholder="输入处理记录..."></textarea>
                    </div>
                    <div class="detail-item"><div class="detail-label">IP 地址</div><div class="detail-value" id="dIP">-</div></div>
                    <div class="detail-item"><div class="detail-label">提交时间</div><div class="detail-value" id="dTime">-</div></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveDetail()">&#x1F4BE; 保存</button>
                <button class="btn btn-outline" onclick="closeDetail()">关闭</button>
            </div>
        </div>
    </div>

    <!-- ===== Status Dict Modal (Admin) ===== -->
    <div class="modal-overlay" id="statusDictModal" style="display:none;">
        <div class="modal" style="width:500px;">
            <div class="modal-header">
                <h3>&#x2699; 状态字典维护</h3>
                <button class="modal-close" onclick="closeStatusDict()">&times;</button>
            </div>
            <div class="modal-body" id="statusDictBody"></div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="addStatusRow()">&#x2795; 新增状态</button>
                <button class="btn btn-success" onclick="saveStatusDict()">&#x1F4BE; 保存修改</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="assets/app.js?v=20260725-stats-menu"></script>
</body>
</html>
