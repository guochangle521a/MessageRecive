<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>网站访问明细</title><link rel="stylesheet" href="assets/style.css"><style>.analytics-tabs{display:flex;gap:8px;flex-wrap:wrap}.analytics-tabs button.active{background:#1a73e8;color:#fff;border-color:#1a73e8}.mono{font-family:Consolas,monospace;font-size:12px}.detail-scroll{max-height:65vh;overflow:auto}.path-list{margin:0;padding-left:22px}.path-list li{margin:6px 0}.table-wrap td{vertical-align:top}</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="logo">&#x1F50E;</div><div><h2>三奇数据平台</h2><span id="sidebarUserRole"></span></div></div><nav class="sidebar-nav" id="sidebarNav"></nav></aside><main class="main-content"><header class="topbar"><div class="topbar-left"><button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button><h3>网站访问明细</h3></div><div class="topbar-right"><span id="topUsername"></span><button class="btn-logout" onclick="doLogout()">退出</button></div></header><div class="page-content">
<div class="panel"><div class="panel-body"><div class="analytics-tabs"><button class="btn btn-outline active" data-mode="events" onclick="switchAnalyticsDetail('events',this)">访问事件</button><button class="btn btn-outline" data-mode="sessions" onclick="switchAnalyticsDetail('sessions',this)">会话明细</button><button class="btn btn-outline" data-mode="pages" onclick="switchAnalyticsDetail('pages',this)">页面分析</button><button class="btn btn-outline" data-mode="visitors" onclick="switchAnalyticsDetail('visitors',this)">访客分析</button></div></div></div>
<div class="panel"><div class="panel-header"><h4>筛选条件</h4><button class="btn btn-outline btn-sm" onclick="resetAnalyticsDetailFilters()">重置</button></div><div class="panel-body"><div class="filter-bar" style="flex-wrap:wrap;"><select id="adSite"></select><input id="adKeyword" placeholder="页面、标题、IP或访客标识"><input id="adStart" type="date"><span>至</span><input id="adEnd" type="date"><select id="adDevice"><option value="">全部设备</option><option value="desktop">桌面端</option><option value="mobile">手机</option><option value="tablet">平板</option></select><select id="adBot"><option value="">全部流量</option><option value="0">正常访问</option><option value="1">机器人访问</option></select><button class="btn btn-primary" onclick="loadAnalyticsDetail(1)">查询</button></div></div></div>
<div class="panel"><div class="panel-header"><h4 id="adTableTitle">访问事件</h4><span id="adCount" style="color:#667085"></span></div><div class="panel-body no-padding"><div class="table-wrap"><table><thead id="adHead"></thead><tbody id="adRows"></tbody></table></div></div><div class="panel-footer"><div class="pagination"><div class="pagination-info" id="adPageInfo"></div><div class="pagination-btns" id="adPageButtons"></div></div></div></div>
</div></main></div>
<div class="modal-overlay" id="analyticsDetailModal" style="display:none;"><div class="modal" style="width:780px;"><div class="modal-header"><h3 id="analyticsDetailTitle">详情</h3><button class="modal-close" onclick="closeAnalyticsDetailModal()">&times;</button></div><div class="modal-body detail-scroll" id="analyticsDetailBody"></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeAnalyticsDetailModal()">关闭</button></div></div></div>
<div class="toast-container" id="toastContainer"></div><script src="assets/app.js?v=20260823-analytics-detail-v2"></script></body></html>
