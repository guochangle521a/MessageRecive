<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>网站数据中心</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="logo">&#x1F4CA;</div><div><h2>三奇数据平台</h2><span id="sidebarUserRole"></span></div></div><nav class="sidebar-nav" id="sidebarNav"></nav></aside><main class="main-content"><header class="topbar"><div class="topbar-left"><button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button><h3>网站数据中心</h3></div><div class="topbar-right"><span id="topUsername"></span><button class="btn-logout" onclick="doLogout()">退出</button></div></header><div class="page-content"><div class="panel"><div class="panel-body"><label>网站：</label><select id="analyticsSite"></select><span style="margin-left:16px;color:#667085">统计口径：UTC存储、北京时间展示；会话超时3分钟</span></div></div><div class="stats-grid"><div class="stat-card"><div class="stat-info"><div class="stat-value" id="pvTotal">0</div><div class="stat-label">浏览量 PV</div></div></div><div class="stat-card"><div class="stat-info"><div class="stat-value" id="uvTotal">0</div><div class="stat-label">访客数 UV（每日IP哈希）</div></div></div><div class="stat-card"><div class="stat-info"><div class="stat-value" id="sessionTotal">0</div><div class="stat-label">会话数</div></div></div></div><div class="panel"><div class="panel-header"><h4>页面分析</h4></div><div class="panel-body no-padding"><table><thead><tr><th>页面</th><th>路径</th><th>PV</th><th>UV</th></tr></thead><tbody id="pageRows"></tbody></table></div></div><div class="panel"><div class="panel-header"><h4>来源渠道</h4></div><div class="panel-body no-padding"><table><thead><tr><th>来源</th><th>会话数</th></tr></thead><tbody id="sourceRows"></tbody></table></div></div></div></main></div><div class="toast-container" id="toastContainer"></div><script src="assets/app.js?v=20260822-platform"></script></body></html>
